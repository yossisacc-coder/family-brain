<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Family Brain official lockup (Logo 02 + wordmark). -->
  <defs>
    <rect id="fb-tile" x="-31" y="-31" width="62" height="62" rx="11.16"/>
    <clipPath id="fb-left">
      <use href="#fb-tile" transform="translate(43 50) rotate(-40)"/>
    </clipPath>
    <mask id="fb-hole">
      <rect width="100" height="100" fill="white"/>
      <use href="#fb-tile" transform="translate(57 50) rotate(40)" fill="black" clip-path="url(#fb-left)"/>
    </mask>
  </defs>
  <g mask="url(#fb-hole)">
    <use href="#fb-tile" transform="translate(43 50) rotate(-40)" fill="#1A1C1E"/>
    <use href="#fb-tile" transform="translate(57 50) rotate(40)" fill="#635BFF"/>
  </g>
  <text x="112" y="64" fill="#1A1C1E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700">Family Brain</text>
</svg>
