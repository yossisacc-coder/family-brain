<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Family Brain official app icon (Logo 02). -->
  <defs>
    <rect id="fb-tile" x="-31" y="-31" width="62" height="62" rx="11.16"/>
    <clipPath id="fb-left">
      <use href="#fb-tile" transform="translate(43 50) rotate(-40)"/>
    </clipPath>
    <mask id="fb-hole">
      <rect width="100" height="100" fill="white"/>
      <use href="#fb-tile" transform="translate(57 50) rotate(40)" fill="black" clip-path="url(#fb-left)"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" rx="225" fill="#0A0033"/>
  <g transform="translate(512 512) scale(8.2) translate(-50 -50)">
    <g mask="url(#fb-hole)">
      <use href="#fb-tile" transform="translate(43 50) rotate(-40)" fill="#FFFFFF"/>
      <use href="#fb-tile" transform="translate(57 50) rotate(40)" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
