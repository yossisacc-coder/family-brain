name: Deploy landing page

on:
  workflow_dispatch:
  push:
    paths:
      - "landing/**"
      - ".github/workflows/deploy-landing.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/cursor/family-brain-mvp-8ebd' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
